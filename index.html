<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting…</title>
    <link rel="canonical" href="https://github.com/Adit-AoE/astar-state-space-explorer">

    <!-- Nothing is drawn: the page is hidden and the browser is sent straight to the repository -->
    <style>html { visibility: hidden; }</style>
    <noscript><style>html { visibility: visible; }</style></noscript>

    <!-- 1) Instant redirect with JavaScript (runs before anything is painted) -->
    <script>location.replace("https://github.com/Adit-AoE/astar-state-space-explorer");</script>

    <!-- 2) Fallback redirect for browsers/bots that do not run JavaScript -->
    <meta http-equiv="refresh" content="0; url=https://github.com/Adit-AoE/astar-state-space-explorer">
</head>
<body>
    <p><a href="https://github.com/Adit-AoE/astar-state-space-explorer">https://github.com/Adit-AoE/astar-state-space-explorer</a></p>
</body>
</html>
